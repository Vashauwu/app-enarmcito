name: Deploy dev

# Sólo se despliega un commit de `develop` cuyo CI terminó en verde. Este archivo debe existir en la rama
# por defecto del repositorio para que GitHub dispare `workflow_run`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # La API se llama siempre por la ruta relativa /api/v1: el proxy de Pages (frontend/functions) la reenvía a
      # Render con la variable API_ORIGIN del proyecto de Cloudflare. El bundle no lleva ninguna URL de API.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration development
      - name: Deploy frontend to Cloudflare Pages
        working-directory: frontend
        run: >-
          npx wrangler@4 pages deploy "${{ vars.FRONTEND_DIST_DIR }}"
          --project-name "${{ vars.CLOUDFLARE_PROJECT }}"
          --branch develop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
