<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <title>Enarmcito · Medicina en lectura guiada</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Artículos médicos resumidos en formato de lectura guiada, con fuente verificable y fecha de revisión.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Aplica el tema guardado antes de pintar, para evitar un destello del tema contrario.
    try {
      var tema = localStorage.getItem('enarmcito.tema');
      if (tema === 'light' || tema === 'dark') document.documentElement.style.colorScheme = tema;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
